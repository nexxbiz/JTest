# Runs JTest suites in Azure Pipelines once the JTest.Tool package is
# published to a reachable feed.
trigger: [ main ]
pool:
  vmImage: ubuntu-latest
steps:
  - task: UseDotNet@2
    inputs:
      version: "10.0.302"
  - script: dotnet tool install --global JTest.Tool
    displayName: Install jtest
  - script: jtest run "tests/**/*.suite.json" --env baseUrl=$(ApiBaseUrl) --report standalone --report-out $(Build.ArtifactStagingDirectory)/jtest-report --diagnostics json
    displayName: Run suites
  - publish: $(Build.ArtifactStagingDirectory)/jtest-report
    condition: always()
    artifact: jtest-report
