name: JTest 2.0 CI

on:
  push:
    branches: ["main", "001-jtest2-pipeline-reporting"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore JTest.sln

      - name: Build
        run: dotnet build JTest.sln -c Release --no-restore

      - name: Test
        run: dotnet test JTest.sln -c Release --no-build

      # jtest must gate CI: validate the fixtures against the shipped language schema...
      - name: jtest validate (schema gate)
        run: dotnet run --project src/JTest.Cli -c Release --no-build -- validate "tests/fixtures/*.json"

      # ...and run them, producing a self-contained report + canonical trace (exit 0 required).
      - name: jtest run (report + trace)
        run: dotnet run --project src/JTest.Cli -c Release --no-build -- run "tests/fixtures/*.json" --report artifacts/report.html --trace artifacts/trace.json --skip-output

      - name: Upload report + trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jtest-report
          path: artifacts/

  version-gate:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the single-sourced version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          TAG="${GITHUB_REF_NAME#v}"
          echo "Directory.Build.props version: $VERSION ; tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Git tag ($TAG) does not match source version ($VERSION)."
            exit 1
          fi

  publish:
    # Publish the single-sourced version (Directory.Build.props) to NuGet when changes land on main.
    # --skip-duplicate makes re-runs idempotent: a version is published once, later merges are no-ops
    # until the version is bumped again.
    needs: build-test-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version
        id: ver
        run: echo "version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack src/JTest.Core/JTest.Core.csproj -c Release -o artifacts
          dotnet pack src/JTest.Cli/JTest.Cli.csproj -c Release -o artifacts

      - name: Push to NuGet (idempotent)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          echo "Publishing version ${{ steps.ver.outputs.version }}"
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
